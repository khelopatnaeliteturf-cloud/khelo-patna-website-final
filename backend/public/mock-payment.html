<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock Cashfree Payment Gateway</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #060810;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: rgba(16, 37, 28, 0.65);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(57, 255, 20, 0.25);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 0 25px rgba(57, 255, 20, 0.15);
            max-width: 400px;
            width: 100%;
        }
        h2 {
            color: #39ff14;
            margin-top: 0;
            letter-spacing: 1px;
        }
        .details {
            background-color: #0b0f19;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
            text-align: left;
        }
        .details p {
            margin: 8px 0;
            font-size: 0.95rem;
        }
        .details strong {
            color: #10b981;
        }
        .btn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border: none;
            color: white;
            font-weight: 600;
            padding: 14px 28px;
            border-radius: 30px;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
            transition: all 0.3s ease;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5);
        }
        .status {
            margin-top: 15px;
            font-weight: 500;
            color: #ffd700;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>💰 CASHFREE SIMULATOR</h2>
        <p>This is a simulated gateway order session for local development testing.</p>
        
        <div class="details">
            <p><strong>Order ID:</strong> <span id="order-id-display">Loading...</span></p>
            <p><strong>Amount:</strong> <span id="amount-display">Loading...</span></p>
        </div>

        <button class="btn" id="pay-btn">Simulate Payment Success</button>
        <div class="status" id="status-msg"></div>
    </div>

    <script>
        // Extract query params
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('order_id') || 'MOCK-' + Date.now();
        const amount = urlParams.get('amount') || '1000';

        document.getElementById('order-id-display').textContent = orderId;
        document.getElementById('amount-display').textContent = '₹' + amount;

        document.getElementById('pay-btn').addEventListener('click', async () => {
            const status = document.getElementById('status-msg');
            status.textContent = 'Processing transaction...';
            
            try {
                // Send simulated webhook event
                const response = await fetch('/api/payment/webhook', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        data: {
                            order: {
                                order_id: orderId,
                                order_amount: Number(amount)
                            },
                            payment: {
                                payment_status: 'SUCCESS',
                                cf_payment_id: 'MOCK_TX_' + Date.now(),
                                payment_amount: Number(amount)
                            }
                        }
                    })
                });

                if (response.ok) {
                    status.style.color = '#39ff14';
                    status.textContent = 'Payment Success Simulated! Redirecting...';
                    
                    // Redirect back to booking success view after 1.5 seconds
                    setTimeout(() => {
                        let returnUrl = '';
                        if (orderId.startsWith('KPFEE-')) {
                            // Academy fee payment return URL
                            returnUrl = `/academy/pay-fees?order_id=${orderId}&payment_status=success`;
                        } else {
                            // Turf booking payment return URL
                            returnUrl = `/book?order_id=${orderId}&payment_status=success`;
                        }

                        // Determine frontend origin dynamically (e.g. localhost:3000)
                        let frontendOrigin = 'http://localhost:3000';
                        if (document.referrer) {
                            try {
                                const refUrl = new URL(document.referrer);
                                frontendOrigin = refUrl.origin;
                            } catch (e) {
                                console.error('Failed to parse referrer origin:', e);
                            }
                        }
                        
                        window.location.href = frontendOrigin + returnUrl;
                    }, 1500);
                } else {
                    status.style.color = '#ff6b6b';
                    status.textContent = 'Webhook simulation failed.';
                }
            } catch (err) {
                console.error(err);
                status.style.color = '#ff6b6b';
                status.textContent = 'Connection error simulating payment.';
            }
        });
    </script>
</body>
</html>
