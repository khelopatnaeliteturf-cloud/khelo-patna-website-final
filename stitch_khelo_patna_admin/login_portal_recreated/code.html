<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Elite Operations Portal - Login</title>
<!-- Font Imports -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&amp;family=Space+Grotesk:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<!-- FontAwesome for Icons -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'deep-space': '#040609',
            'glass-bg': 'rgba(255, 255, 255, 0.03)',
            'glass-border': 'rgba(255, 255, 255, 0.08)',
            'neon-emerald': '#00FF88',
            'neon-cyan': '#00C8FF',
            'gold-accent': '#E5B80B',
            'input-bg': '#0f1115',
            'input-border': '#2a2d36',
          },
          fontFamily: {
            'montserrat': ['Montserrat', 'sans-serif'],
            'space': ['Space Grotesk', 'sans-serif'],
          },
          boxShadow: {
            'glow-emerald': '0 0 15px rgba(0, 255, 136, 0.3)',
            'glass': '0 8px 32px 0 rgba(0, 0, 0, 0.37)',
          }
        }
      }
    }
  </script>
<!-- Custom Styles -->
<style data-purpose="custom-utilities">
    body {
      background-color: #040609;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    
    .glass-panel {
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .gradient-text {
      background: linear-gradient(to right, #ffffff, #a0aec0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>
<body class="font-space antialiased p-4">
<!-- BEGIN: Main Login Container -->
<main class="w-full max-w-md mx-auto flex flex-col items-center">
<!-- Header Section -->
<header class="text-center mb-8 flex flex-col items-center">
<!-- Logo -->
<img alt="Khelo Patna Elite Turf Logo" class="w-32 h-32 object-contain mb-6 drop-shadow-xl" src="https://lh3.googleusercontent.com/aida/AP1WRLvvTjEz-RmTBtNuMxp4Dddp3mKx-6UaiqBDW8dJkPy9LkXr1RX9f5T0kpwON4D4Vck1C_IdkdRQzSK-L8KhU7auU5ODnkN-vr2wn3-2KDGDcElAHxVQX3ZOa_hMrznw342pFGAhvPFCVOH-wncj6lcYWpssmg_Uxk1C6aMHQp9n7iZGt7ixd4UKqoGpnhDNzQyTHTUIgDnTNPGm-OarzHuetVmNoqasoAi3oXN_C-0YTiVhrhRxXmC9Kns"/>
<!-- Titles -->
<h1 class="font-montserrat text-3xl font-extrabold tracking-tight mb-2 text-white">Elite Operations Portal</h1>
<p class="text-gray-400 text-sm font-medium tracking-wide">Secure access for authorized personnel only.</p>
</header>
<!-- Login Form Card -->
<div class="glass-panel rounded-2xl w-full p-6 sm:p-8 shadow-glass mb-8">
<form action="#" class="space-y-6" method="POST">
<!-- Staff ID / Email Field -->
<div>
<label class="block text-xs font-semibold text-gray-300 uppercase tracking-wider mb-2" for="staff-id">Staff ID / Email</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<i class="fa-regular fa-id-badge text-gray-500"></i>
</div>
<input class="w-full pl-11 pr-4 py-3 bg-input-bg border border-input-border rounded-xl text-white placeholder-gray-600 focus:outline-none focus:ring-1 focus:ring-neon-emerald focus:border-neon-emerald transition-colors" id="staff-id" name="staff-id" placeholder="OP-4921" type="text"/>
</div>
</div>
<!-- Password Field -->
<div>
<label class="block text-xs font-semibold text-gray-300 uppercase tracking-wider mb-2" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<i class="fa-solid fa-lock text-gray-500"></i>
</div>
<input class="w-full pl-11 pr-12 py-3 bg-input-bg border border-input-border rounded-xl text-white placeholder-gray-600 focus:outline-none focus:ring-1 focus:ring-neon-emerald focus:border-neon-emerald transition-colors" id="password" name="password" placeholder="••••••••" type="password"/>
<div class="absolute inset-y-0 right-0 pr-4 flex items-center cursor-pointer">
<i class="fa-regular fa-eye text-gray-500 hover:text-gray-300 transition-colors"></i>
</div>
</div>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end">
<a class="text-gold-accent hover:text-yellow-300 text-sm font-medium transition-colors" href="#">Forgot Password?</a>
</div>
<!-- Action Buttons -->
<div class="space-y-4 pt-2">
<!-- Primary Login -->
<button class="w-full py-3.5 px-4 rounded-xl bg-gradient-to-r from-neon-emerald to-neon-cyan text-[#040609] font-montserrat font-bold text-lg tracking-wide shadow-glow-emerald hover:opacity-90 transition-all flex justify-center items-center gap-2" type="submit">
            LOGIN <i class="fa-solid fa-arrow-right-to-bracket text-base"></i>
</button>
<!-- Biometric Sign-in -->
<button class="w-full py-3.5 px-4 rounded-xl bg-[#131720] border border-gray-800 text-gray-300 font-medium text-base hover:bg-gray-800 transition-colors flex justify-center items-center gap-2" type="button">
<i class="fa-solid fa-fingerprint text-neon-cyan"></i> Biometric Sign-In
          </button>
</div>
</form>
</div>
<!-- Footer -->
<footer class="mt-auto pt-8 pb-4">
<p class="text-[10px] text-gray-600 tracking-[0.2em] font-semibold uppercase">
        v2.4.0-PRO | POWERED BY KHELOPATNA
      </p>
</footer>
</main>
<!-- END: Main Login Container -->
</body></html>
